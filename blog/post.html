<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Leonardo H. Batista</title>
  <link rel="icon" href="/img/favicon.ico" />
  <script>
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/dist/output.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dist/fa.min.css" />
  <link rel="stylesheet" href="/dist/devicon.min.css" />
</head>
<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 font-sans transition-colors duration-300">

  <!-- NAV -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-zinc-900/90 backdrop-blur border-b border-zinc-200 dark:border-zinc-700">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <a href="/index.html" class="font-semibold text-primary-600 dark:text-primary-400 tracking-tight">leohbatista</a>
      <div class="flex items-center gap-1">
        <nav class="hidden md:flex items-center gap-1 sm:gap-2 text-sm font-medium">
          <a href="/index.html"       class="px-3 py-1.5 rounded-md text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">Profile</a>
          <a href="/curriculum.html"  class="px-3 py-1.5 rounded-md text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">Curriculum</a>
          <a href="/content.html"     class="px-3 py-1.5 rounded-md text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">Content</a>
          <a href="/blog/index.html"  class="px-3 py-1.5 rounded-md bg-primary-50 dark:bg-primary-900/40 text-primary-700 dark:text-primary-300">Blog</a>
        </nav>
        <button id="theme-toggle" aria-label="Toggle dark mode"
          class="p-2 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">
          <svg id="icon-sun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14A7 7 0 0012 5z"/>
          </svg>
          <svg id="icon-moon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false"
          class="md:hidden p-2 rounded-md text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">
          <svg id="icon-menu-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg id="icon-menu-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <nav id="mobile-menu" class="hidden md:hidden border-t border-zinc-200 dark:border-zinc-700 px-4 sm:px-6 py-2 flex flex-col gap-1 text-sm font-medium">
      <a href="/index.html"       class="px-3 py-2 rounded-md text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">Profile</a>
      <a href="/curriculum.html"  class="px-3 py-2 rounded-md text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">Curriculum</a>
      <a href="/content.html"     class="px-3 py-2 rounded-md text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors">Content</a>
      <a href="/blog/index.html"  class="px-3 py-2 rounded-md bg-primary-50 dark:bg-primary-900/40 text-primary-700 dark:text-primary-300">Blog</a>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-16">
    <a href="/blog/index.html" class="inline-flex items-center gap-1 text-sm text-primary-600 dark:text-primary-400 hover:underline mb-8">&larr; Back to blog</a>

    <article id="post-content">
      <p class="text-zinc-400 dark:text-zinc-600">Loading post…</p>
    </article>
  </main>

  <footer class="border-t border-zinc-200 dark:border-zinc-700 mt-16 py-8 text-center text-sm text-zinc-400 dark:text-zinc-600">
    <p>© 2026 Leonardo H. Batista · Campinas, Brazil</p>
  </footer>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });

    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      document.getElementById('icon-menu-open').classList.toggle('hidden');
      document.getElementById('icon-menu-close').classList.toggle('hidden');
      menuToggle.setAttribute('aria-expanded', String(!mobileMenu.classList.contains('hidden')));
    });
  </script>
  <script src="/blog/js/markdown.js"></script>
  <script src="/blog/js/post.js"></script>

</body>
</html>
